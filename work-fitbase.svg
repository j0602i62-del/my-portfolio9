<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="fb-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#fb-bg)"/>
  <rect x="50" y="45" width="700" height="410" rx="10" fill="#0b0f19" stroke="#312e81" stroke-width="1.5"/>
  <circle cx="75" cy="65" r="5" fill="#ef4444"/>
  <circle cx="95" cy="65" r="5" fill="#f59e0b"/>
  <circle cx="115" cy="65" r="5" fill="#10b981"/>
  <rect x="145" y="56" width="300" height="18" rx="4" fill="#1e1b4b"/>
  <text x="155" y="69" fill="#a5b4fc" font-family="'Inter', sans-serif" font-size="11">fitbase-gym.jp</text>

  <!-- Header -->
  <text x="75" y="112" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="18" letter-spacing="1">FITBASE<tspan fill="#ef4444">.</tspan></text>
  <text x="440" y="110" fill="#cbd5e1" font-family="'Noto Sans JP', sans-serif" font-size="11">プログラム</text>
  <text x="525" y="110" fill="#cbd5e1" font-family="'Noto Sans JP', sans-serif" font-size="11">料金プラン</text>
  <text x="600" y="110" fill="#cbd5e1" font-family="'Noto Sans JP', sans-serif" font-size="11">トレーナー</text>
  <rect x="655" y="94" width="80" height="25" rx="4" fill="url(#fb-accent)"/>
  <text x="668" y="110" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="10">無料体験</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#1e293b" stroke-width="1"/>

  <!-- Content -->
  <rect x="75" y="155" width="125" height="22" rx="4" fill="#ef4444"/>
  <text x="87" y="170" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="10">PERSONAL GYM</text>

  <text x="75" y="225" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="26">身体が変われば、</text>
  <text x="75" y="265" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="26">人生が動き出す。</text>
  <text x="75" y="300" fill="#94a3b8" font-family="'Noto Sans JP', sans-serif" font-size="12">完全個室 × 科学的トレーニング × 食事管理で最短ボディメイク</text>

  <!-- Metrics box on right -->
  <rect x="460" y="155" width="250" height="240" rx="8" fill="#1e1b4b" stroke="#3730a3"/>
  <text x="480" y="195" fill="#cbd5e1" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="13">3大コミット</text>
  <line x1="480" y1="210" x2="690" y2="210" stroke="#312e81" stroke-width="1"/>

  <text x="480" y="240" fill="#ef4444" font-family="'Inter', sans-serif" font-weight="800" font-size="18">01 <tspan fill="#ffffff" font-size="12" font-family="'Noto Sans JP', sans-serif">完全マンツーマン指導</tspan></text>
  <text x="480" y="285" fill="#ef4444" font-family="'Inter', sans-serif" font-weight="800" font-size="18">02 <tspan fill="#ffffff" font-size="12" font-family="'Noto Sans JP', sans-serif">無理のない糖質コントロール</tspan></text>
  <text x="480" y="330" fill="#ef4444" font-family="'Inter', sans-serif" font-weight="800" font-size="18">03 <tspan fill="#ffffff" font-size="12" font-family="'Noto Sans JP', sans-serif">完全手ぶら来店OK</tspan></text>

  <rect x="480" y="355" width="210" height="28" rx="4" fill="url(#fb-accent)"/>
  <text x="525" y="373" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-weight="700" font-size="11">無料カウンセリング予約</text>
</svg>