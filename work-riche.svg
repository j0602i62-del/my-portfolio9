<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="riche-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f3ede6" />
    </linearGradient>
    <linearGradient id="riche-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#dfc282" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#riche-bg)"/>
  <rect x="50" y="45" width="700" height="410" rx="10" fill="#ffffff" stroke="#e8ded2" stroke-width="1.5"/>
  <circle cx="75" cy="65" r="5" fill="#e8ded2"/>
  <circle cx="95" cy="65" r="5" fill="#e8ded2"/>
  <circle cx="115" cy="65" r="5" fill="#e8ded2"/>
  <rect x="145" y="56" width="300" height="18" rx="4" fill="#faf6f0"/>
  <text x="155" y="69" fill="#8c7e72" font-family="'Cormorant Garamond', serif" font-size="11">hairsalon-riche.jp</text>

  <!-- Header -->
  <text x="75" y="112" fill="#2c2825" font-family="'Cormorant Garamond', serif" font-weight="700" font-size="19" letter-spacing="2">Hair Salon RICHE</text>
  <text x="440" y="110" fill="#7d7268" font-family="'Noto Sans JP', sans-serif" font-size="11">コンセプト</text>
  <text x="515" y="110" fill="#7d7268" font-family="'Noto Sans JP', sans-serif" font-size="11">メニュー</text>
  <text x="580" y="110" fill="#7d7268" font-family="'Noto Sans JP', sans-serif" font-size="11">スタイリスト</text>
  <rect x="650" y="94" width="80" height="25" rx="12" fill="url(#riche-gold)"/>
  <text x="668" y="110" fill="#ffffff" font-family="'Noto Sans JP', sans-serif" font-weight="600" font-size="10">WEB予約</text>
  <line x1="50" y1="128" x2="750" y2="128" stroke="#f0e8de" stroke-width="1"/>

  <!-- Content -->
  <text x="400" y="185" fill="#c5a059" font-family="'Cormorant Garamond', serif" font-size="12" letter-spacing="4" text-anchor="middle">PRIVATE HAIR SALON</text>
  <text x="400" y="230" fill="#2c2825" font-family="'Shippori Mincho', serif" font-weight="600" font-size="24" text-anchor="middle">髪と心がほどける、上質な時間。</text>
  <text x="400" y="265" fill="#7d7268" font-family="'Noto Sans JP', sans-serif" font-size="11" text-anchor="middle">一人ひとりの骨格・髪質に寄り添う丁寧なカウンセリングとオーダーメイド施術</text>

  <rect x="120" y="310" width="160" height="110" rx="8" fill="#faf6f0" stroke="#ebdccf"/>
  <text x="200" y="355" fill="#2c2825" font-family="'Shippori Mincho', serif" font-size="13" font-weight="600" text-anchor="middle">Cut &amp; Color</text>
  <text x="200" y="380" fill="#8c7e72" font-family="'Noto Sans JP', sans-serif" font-size="10" text-anchor="middle">透明感ある艶カラー</text>

  <rect x="320" y="310" width="160" height="110" rx="8" fill="#faf6f0" stroke="#ebdccf"/>
  <text x="400" y="355" fill="#2c2825" font-family="'Shippori Mincho', serif" font-size="13" font-weight="600" text-anchor="middle">Head Spa</text>
  <text x="400" y="380" fill="#8c7e72" font-family="'Noto Sans JP', sans-serif" font-size="10" text-anchor="middle">オーガニック頭皮ケア</text>

  <rect x="520" y="310" width="160" height="110" rx="8" fill="#faf6f0" stroke="#ebdccf"/>
  <text x="600" y="355" fill="#2c2825" font-family="'Shippori Mincho', serif" font-size="13" font-weight="600" text-anchor="middle">Treatment</text>
  <text x="600" y="380" fill="#8c7e72" font-family="'Noto Sans JP', sans-serif" font-size="10" text-anchor="middle">髪質改善トリートメント</text>
</svg>