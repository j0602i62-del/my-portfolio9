<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <!-- Skin Gradient -->
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5ed" />
      <stop offset="100%" stop-color="#fedac5" />
    </linearGradient>
    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8c9b0" />
      <stop offset="100%" stop-color="#e8a88c" />
    </linearGradient>
    <!-- Hair Gradient (Dark Navy / Slate Cool Tone) -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <!-- Blazer Gradient (Cool Navy / Indigo) -->
    <linearGradient id="blazerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle with tech cyan accent ring -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" />
  <circle cx="200" cy="200" r="178" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- Background decorative sparkles -->
  <circle cx="75" cy="115" r="4" fill="#38bdf8" opacity="0.7" />
  <circle cx="325" cy="105" r="5" fill="#60a5fa" opacity="0.6" />
  <circle cx="330" cy="285" r="4" fill="#38bdf8" opacity="0.5" />
  <path d="M70 145 L80 145 M75 140 L75 150" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M320 80 L330 80 M325 75 L325 85" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <g filter="url(#softGlow)">
    <!-- Back Hair (Short Cool Spikes for Male Anime Silhouette) -->
    <path d="M115 170 C 110 120, 140 60, 200 60 C 260 60, 290 120, 285 170 C 295 195, 290 230, 275 250 C 260 260, 140 260, 125 250 C 110 230, 105 195, 115 170 Z" fill="url(#hairGrad)" />
    <!-- Back hair spike tips -->
    <path d="M120 120 L 100 135 L 125 145 Z" fill="#1e293b"/>
    <path d="M110 150 L 95 170 L 122 175 Z" fill="#1e293b"/>
    <path d="M280 120 L 300 135 L 275 145 Z" fill="#1e293b"/>
    <path d="M290 150 L 305 170 L 278 175 Z" fill="#1e293b"/>

    <!-- Broad Male Shoulders & Clothes -->
    <!-- Blazer Base -->
    <path d="M85 385 C 90 310, 130 275, 170 270 L 200 300 L 230 270 C 270 275, 310 310, 315 385 Z" fill="url(#blazerGrad)" />
    
    <!-- White Inner Shirt with V-neck -->
    <path d="M165 270 L 200 335 L 235 270 Z" fill="#ffffff" />
    <path d="M178 270 L 200 310 L 222 270 Z" fill="#e2e8f0" />
    <!-- Blazer Lapels (Sharp Male Cut) -->
    <path d="M140 275 L 180 345 L 165 385 L 110 385 Z" fill="#0f172a" />
    <path d="M260 275 L 220 345 L 235 385 L 290 385 Z" fill="#0f172a" />
    <!-- Blue accent pocket / tie element -->
    <line x1="140" y1="330" x2="160" y2="330" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Strong Masculine Neck -->
    <path d="M178 210 L 178 275 C 190 282, 210 282, 222 275 L 222 210 Z" fill="url(#skin)" />
    <!-- Neck shadow -->
    <path d="M178 210 L 178 235 C 192 250, 208 250, 222 235 L 222 210 Z" fill="url(#skinShadow)" />
    <!-- Adam's Apple shadow (distinct male feature) -->
    <path d="M197 248 L 200 254 L 203 248" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Sharp Masculine Anime Face / Jaw -->
    <path d="M138 145 C 138 110, 160 90, 200 90 C 240 90, 262 110, 262 145 C 262 188, 245 220, 200 242 C 155 220, 138 188, 138 145 Z" fill="url(#skin)" />

    <!-- Ears -->
    <ellipse cx="137" cy="165" rx="8" ry="15" fill="url(#skin)" />
    <ellipse cx="263" cy="165" rx="8" ry="15" fill="url(#skin)" />
    <path d="M137 160 Q 140 165 137 170" fill="none" stroke="#e09f82" stroke-width="1.5" />
    <path d="M263 160 Q 260 165 263 170" fill="none" stroke="#e09f82" stroke-width="1.5" />

    <!-- Sharp Cool Male Eyes -->
    <!-- Left Eye -->
    <g transform="translate(158, 155)">
      <!-- Masculine Eyebrow (Sharp, Dark) -->
      <path d="M -6,-12 Q 10,-20 26,-11" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
      <!-- Upper Lid -->
      <path d="M -4,0 Q 10,-8 26,-2" fill="none" stroke="#090d16" stroke-width="3.8" stroke-linecap="round" />
      <!-- Iris (Deep Blue) -->
      <ellipse cx="12" cy="4" rx="6.5" ry="7.5" fill="#1e3a8a" />
      <ellipse cx="12" cy="5" rx="4.5" ry="5.5" fill="#0284c7" />
      <circle cx="12" cy="5" r="2.8" fill="#090d16" />
      <!-- Sharp Highlight -->
      <circle cx="9.5" cy="2" r="2" fill="#ffffff" />
      <!-- Lower Lid Line -->
      <path d="M 4,11 Q 12,13 18,10" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" />
    </g>

    <!-- Right Eye -->
    <g transform="translate(216, 155)">
      <!-- Masculine Eyebrow -->
      <path d="M -6,-11 Q 10,-20 26,-12" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
      <!-- Upper Lid -->
      <path d="M -4,-2 Q 10,-8 26,0" fill="none" stroke="#090d16" stroke-width="3.8" stroke-linecap="round" />
      <!-- Iris -->
      <ellipse cx="10" cy="4" rx="6.5" ry="7.5" fill="#1e3a8a" />
      <ellipse cx="10" cy="5" rx="4.5" ry="5.5" fill="#0284c7" />
      <circle cx="10" cy="5" r="2.8" fill="#090d16" />
      <!-- Highlight -->
      <circle cx="7.5" cy="2" r="2" fill="#ffffff" />
      <!-- Lower Lid Line -->
      <path d="M 4,10 Q 10,13 18,11" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" />
    </g>

    <!-- Sharp Clean Male Nose -->
    <path d="M198 175 L 202 186 L 197 188" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Confident Male Smirk / Mouth -->
    <path d="M188 208 Q 200 216 214 208" fill="none" stroke="#334155" stroke-width="2.6" stroke-linecap="round" />
    <path d="M196 217 Q 200 219 204 217" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />

    <!-- Male Stylish Short Hair Layers (Cool Shonen/Seinen Hero Haircut) -->
    <!-- Back-to-front hair volume -->
    <path d="M132 140 C 125 80, 160 55, 200 55 C 240 55, 275 80, 268 140 C 258 120, 240 130, 230 145 C 225 125, 212 120, 202 148 C 195 120, 180 115, 170 152 C 162 125, 148 122, 138 142 Z" fill="url(#hairGrad)" />

    <!-- Left sideburn & fringe layers -->
    <path d="M135 130 C 128 150, 130 180, 139 192 C 141 180, 140 160, 142 145 Z" fill="url(#hairGrad)" />
    <!-- Right sideburn -->
    <path d="M265 130 C 272 150, 270 180, 261 192 C 259 180, 260 160, 258 145 Z" fill="url(#hairGrad)" />

    <!-- Top Spikes & Volume (Short anime boy spikes) -->
    <path d="M175 62 L 180 40 L 192 60 Z" fill="#334155" />
    <path d="M195 56 L 205 35 L 215 56 Z" fill="#334155" />
    <path d="M218 62 L 230 45 L 235 68 Z" fill="#1e293b" />
    <path d="M155 75 L 150 55 L 168 72 Z" fill="#1e293b" />

    <!-- Dynamic Center Bangs -->
    <path d="M185 75 Q 182 125 174 148 Q 185 120 195 95 Z" fill="#475569" opacity="0.8"/>
    <path d="M208 72 Q 214 125 224 150 Q 216 120 206 95 Z" fill="#475569" opacity="0.8"/>

    <!-- Cool Cyan Hair Highlight / Sheen -->
    <path d="M150 95 Q 200 82 250 95" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M160 105 Q 200 94 240 105" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>